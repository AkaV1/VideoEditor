name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: bash scripts/ci-run.sh "npm install" npm install --no-audit --no-fund

      - name: Compilar la web
        run: bash scripts/ci-run.sh "npm run build" npm run build

      - name: Crear el proyecto Android
        run: bash scripts/ci-run.sh "cap add android" npx cap add android

      - name: Personalizar (iconos, tema)
        run: bash scripts/ci-run.sh "patch-android" node scripts/patch-android.mjs

      - name: Sincronizar Capacitor
        run: bash scripts/ci-run.sh "cap sync" npx cap sync android

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        working-directory: android
        run: bash ../scripts/ci-run.sh "gradle assembleDebug" ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LineCut-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LineCut.apk
          gh release create "linecut-${{ github.run_number }}" LineCut.apk \
            --title "LineCut build ${{ github.run_number }}" \
            --notes "APK de depuración de LineCut generado automáticamente."
