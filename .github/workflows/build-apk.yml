name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Resumen del build::$msg"
          fi
          exit $code

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoEditor.apk
          gh release create "build-${{ github.run_number }}" VideoEditor.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "APK de depuración generado automáticamente."
