name: Build LineCut Linux (Qt nativo)

on:
  push:
    branches: [main]
    paths: ["linux/**", ".github/workflows/build-linux-qt.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libxcb-randr0 libxcb-util1 \
            libxcb-sync1 libxcb-xfixes0 libpulse0 >/dev/null

      - name: Prueba del núcleo (sin interfaz)
        working-directory: linux
        run: |
          pip install -r requirements.txt
          bash ../scripts/ci-run.sh "prueba del núcleo" python tests/test_core.py

      - name: Autoprueba de la interfaz (desde el código)
        working-directory: linux
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash ../scripts/ci-run.sh "autoprueba de la interfaz" python -m linecut --selftest "$PWD/shots"

      - name: Empaquetar AppImage
        working-directory: linux
        run: bash ../scripts/ci-run.sh "build-appimage" bash build-appimage.sh "$PWD/out"

      - name: Autoprueba del paquete (extraído)
        working-directory: linux
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x out/LineCut-x86_64.AppImage
          bash ../scripts/ci-run.sh "autoprueba del AppImage" out/LineCut-x86_64.AppImage --appimage-extract-and-run --selftest "$PWD/shots-pkg" || \
          bash ../scripts/ci-run.sh "autoprueba del AppImage (2)" bash -c 'out/LineCut-x86_64.AppImage --appimage-extract && QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --selftest "$PWD/shots-pkg"'

      - name: Subir capturas y AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LineCut-Qt
          path: |
            linux/out/*.AppImage
            linux/shots/*.png
            linux/shots-pkg/*.png

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp linux/out/LineCut-x86_64.AppImage LineCut-x86_64.AppImage
          gh release create "linecut-linux-qt-${{ github.run_number }}" LineCut-x86_64.AppImage \
            --title "LineCut para Linux — app nativa Qt (build ${{ github.run_number }})" \
            --notes "App nativa (PySide6 + ffmpeg), sin Chromium ni Electron. chmod +x LineCut-x86_64.AppImage && ./LineCut-x86_64.AppImage"
